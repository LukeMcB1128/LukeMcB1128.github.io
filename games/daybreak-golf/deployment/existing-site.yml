# Install this workflow as .github/workflows/deploy.yml in LukeMcB1128.github.io.
# Keep this game source under games/daybreak-golf in that repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for blog
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build blog
        run: npm run build

      - name: Setup Node for Daybreak Golf
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/daybreak-golf/package-lock.json

      - name: Install Daybreak Golf dependencies
        run: npm ci --prefix games/daybreak-golf

      - name: Test Daybreak Golf
        run: npm --prefix games/daybreak-golf test

      - name: Build Daybreak Golf for Pages
        run: npm --prefix games/daybreak-golf run build:pages

      - name: Check Daybreak Golf assets
        run: npm --prefix games/daybreak-golf run check:pages

      - name: Add Daybreak Golf to the site output
        run: |
          mkdir -p out/daybreak-golf
          cp -R games/daybreak-golf/apps/web/dist/. out/daybreak-golf/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
